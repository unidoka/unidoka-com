name: unidoka-com
include:
  - backend/docker-compose.yml
  - website/docker-compose.yml

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=unidoka.com@mail.ru"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--api.insecure=${TRAEFIK_API_INSECURE:-false}"
      # Healthcheck endpoint + quiet logs. Verbose access logs on a
      # 1 vCPU box are pure overhead — journald flushes every request
      # to disk, and every request makes it worse.
      - "--ping=true"
      - "--accesslog=false"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  main-network:
    name: main-network
    external: false
