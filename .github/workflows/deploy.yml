name: Deploy to prod

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild every service, ignoring git diff"
        type: boolean
        default: false

# Only one deploy at a time. A queued run waits for the in-flight one
# to finish, then starts. Without this, two quick pushes race on
# `docker compose up -d` and can leave the VPS in a half-swapped state.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ── 1. Decide what changed (runs on the GitHub runner) ──────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so github.event.before is present in local
          # history. With fetch-depth: 2, a multi-commit push leaves the
          # "before" SHA outside the fetched window and `git diff` fails.
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.force_rebuild }}" = "true" ]; then
            CHANGED="ALL"
          elif [ "${{ github.event_name }}" = "push" ] \
               && [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Full push range, not just the tip commit. Fixes the
            # "merge moved 10 commits but only #10 is seen" bug.
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "ALL")
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if [ "$CHANGED" = "ALL" ]; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          backend=false
          frontend=false

          grep -qE '^backend/services/main-service/' <<<"$CHANGED" && backend=true  || true
          grep -qE '^website/'                       <<<"$CHANGED" && frontend=true || true

          # Root files that invalidate build args or runtime config for
          # every service — rebuild both when any of them changes.
          # .env.example / .env / compose files / the workflow itself /
          # the SQL seed that runs after migrations.
          if grep -qE '^(\.env(\.example|\.dev|\.prod)?|docker-compose\.yml|backend/docker-compose\.yml|website/docker-compose\.yml|backend/seed_events\.sql|\.github/workflows/deploy\.yml)$' <<<"$CHANGED"; then
            backend=true
            frontend=true
          fi

          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # ── 2a. Build backend on the runner, ship the image to the VPS ───
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/main-service
          file: ./backend/services/main-service/Dockerfile
          load: true
          tags: main-service:deploy
          cache-from: type=gha,scope=main-service
          cache-to:   type=gha,scope=main-service,mode=max

      - name: Save image to tarball
        run: docker save main-service:deploy | gzip -1 > main-service.tar.gz

      - name: Upload tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: main-service.tar.gz
          target: ${{ secrets.PROJECT_PATH }}/.deploy/

  # ── 2b. Build frontend on the runner, ship the image to the VPS ──
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          target: prod
          load: true
          tags: next-js:deploy
          # Next.js inlines NEXT_PUBLIC_* at BUILD time. These must be
          # present on the runner — they are read from repo Variables,
          # not from the VPS .env, because the VPS no longer builds.
          #
          # NOTE: the Dockerfile declares ARG NEXT_PUBLIC_PROTOCOL
          # (no _HTTP_ prefix). The previous workflow passed
          # NEXT_PUBLIC_HTTP_PROTOCOL, which the Dockerfile ignored.
          build-args: |
            NEXT_PUBLIC_ROOT_DOMAIN=${{ vars.NEXT_PUBLIC_ROOT_DOMAIN }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_PROTOCOL=${{ vars.NEXT_PUBLIC_HTTP_PROTOCOL }}
          cache-from: type=gha,scope=next-js
          cache-to:   type=gha,scope=next-js,mode=max

      - name: Save image to tarball
        run: docker save next-js:deploy | gzip -1 > next-js.tar.gz

      - name: Upload tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: next-js.tar.gz
          target: ${{ secrets.PROJECT_PATH }}/.deploy/

  # ── 3. Load the images + reconcile containers on the VPS ─────────
  deploy:
    needs: [changes, build-backend, build-frontend]
    # Run even when a build job was skipped (that service didn't
    # change) — the deploy script still needs to reconcile state.
    #
    # Branch guard: on workflow_dispatch, this prevents a manual run
    # from a non-main branch reaching prod. push-to-main already
    # satisfies this, so it's a no-op for the normal path.
    if: |
      always() && !cancelled() && !failure()
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        envs: BACKEND_CHANGED,FRONTEND_CHANGED
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_PATH }}"
            mkdir -p .deploy

            if [ "$BACKEND_CHANGED" != "true" ] \
               && ! docker image inspect main-service:local >/dev/null 2>&1; then
              echo "ERROR: main-service:local missing and backend didn't change."
              echo "Re-run this workflow with force_rebuild=true."
              exit 1
            fi
            if [ "$FRONTEND_CHANGED" != "true" ] \
               && ! docker image inspect next-js:local >/dev/null 2>&1; then
              echo "ERROR: next-js:local missing and frontend didn't change."
              echo "Re-run this workflow with force_rebuild=true."
              exit 1
            fi

            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "==> Loading backend image"
              docker load < .deploy/main-service.tar.gz
              docker tag main-service:deploy main-service:local
              rm -f .deploy/main-service.tar.gz
            fi

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "==> Loading frontend image"
              docker load < .deploy/next-js.tar.gz
              docker tag next-js:deploy next-js:local
              rm -f .deploy/next-js.tar.gz
            fi

            echo "==> Reconciling containers"
            docker compose --profile prod up -d

            echo "==> Waiting for services to become healthy"
            for i in $(seq 1 40); do
              ps_json=$(docker compose ps --format json 2>/dev/null || echo "")
              starting=$(grep -c '"Health":"starting"'  <<<"$ps_json" || true)
              unhealthy=$(grep -c '"Health":"unhealthy"' <<<"$ps_json" || true)
              if [ "$starting" = "0" ] && [ "$unhealthy" = "0" ]; then
                echo "  healthy after ${i} checks"
                break
              fi
              sleep 5
            done

            echo "==> Container status"
            docker compose ps
            echo "==> main-service logs (tail)"
            docker compose logs --tail=80 main-service || true
        env:
          BACKEND_CHANGED:  ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
