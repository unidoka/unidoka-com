name: Hello
# Diagnostic workflow.
# If pushing to main (or master) does NOT produce a run of this
# workflow in the Actions tab, the problem is repo-level — not this
# file's trigger. Check:
#   1. Settings → Actions → General → "Allow all actions and
#      reusable workflows"
#   2. If the repo belongs to an org:
#      Org Settings → Actions → General → same toggle
#   3. That .github/workflows/hello.yml exists on the DEFAULT branch
#      (the default branch is what GitHub reads for workflow_dispatch
#      and for the workflow list in the Actions tab).
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: |
          echo "Workflow is running."
          echo "Event:  ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Repo:   ${{ github.repository }}"
          echo "Actor:  ${{ github.actor }}"
