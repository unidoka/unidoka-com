services:
  main-service:
    build:
      context: ./services/main-service
      dockerfile: Dockerfile
    container_name: main-service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: ../.env
    environment:
      - MAIN_DB_HOST=main-db
    volumes:
      - ./services/main-service:/app
      - ./services/main-service/storage:/app/storage
    depends_on:
      main-db:
        condition: service_healthy
    networks:
      - main-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # Only claim paths FastAPI actually serves. PathPrefix('/api') would
      # also swallow /api/admin-secret and /api/revalidate — both Next.js
      # route handlers on the frontend router (priority 1). Priority 100
      # was higher, so FastAPI returned 404 for them.
      - "traefik.http.routers.main-service.rule=PathPrefix(`/api/v1`) || PathPrefix(`/docs`) || PathPrefix(`/health`)"
      - "traefik.http.routers.main-service.priority=100"
      - "traefik.http.routers.main-service.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.main-service.tls=${TLS_ENABLED}"
      - "traefik.http.routers.main-service.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.main-service.loadbalancer.server.port=8000"
  main-db:
    image: postgres:15-alpine
    container_name: main-db
    env_file: ../.env
    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
    volumes:
      - main_db_data:/var/lib/postgresql/data
    networks:
      - main-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  valkey:
    image: valkey/valkey:7-alpine
    container_name: valkey
    command: valkey-server --requirepass ${CACHE_PASSWORD} --appendonly yes
    networks:
      - main-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  main-network:
    name: main-network
    external: false
  default:
volumes:
  main_db_data:
