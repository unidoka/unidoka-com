[project]
name = "unidoka-events-mcp"
version = "0.2.0"
description = "MCP server for Unidoka admin events (stdio + HTTP)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.32.0",
  "starlette>=0.40.0",
]

[project.scripts]
unidoka-events-mcp = "unidoka_events_mcp.server:main"
unidoka-events-mcp-http = "unidoka_events_mcp.http_server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["unidoka_events_mcp*"]
