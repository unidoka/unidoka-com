services:
  next-js:
    container_name: next-js
    env_file:
      - ./.env
    build:
      context: .
      target: prod
      args:
        # Next.js inlines NEXT_PUBLIC_* at BUILD time. These must be present
        # during `npm run build` — setting them at runtime has no effect.
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_HTTP_PROTOCOL: ${NEXT_PUBLIC_HTTP_PROTOCOL:-https}
    volumes:
      # public/ is NOT baked into the image (see website/Dockerfile). It is
      # mounted from the host so the image stays lean and static assets can
      # be updated without a rebuild.
      - ./public:/app/public
      # Backend writes uploaded order files to the same host dir, served
      # by Next.js under /public/order_files. This nested bind mount wins
      # over the parent ./public mount for this specific subpath.
      - ../backend/services/main-service/storage/order_files:/app/public/order_files
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.rule=${DOMAIN}"
      # Priority 1 — explicit catch-all. Backend routers declare higher
      # priorities (see backend/docker-compose.yml) so that /api, /docs,
      # and /health never fall through to Next.js. Setting both sides
      # explicitly means neither depends on rule-string length.
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.frontend.tls=${TLS_ENABLED}"
      - "traefik.http.routers.frontend.tls.certresolver=${CERT_RESOLVER}"
    networks:
      - main-network
networks:
  main-network:
    name: main-network
    external: false
  default: