services:
  next-js:
    container_name: next-js
    env_file:
      - ./.env
    environment:
      # Force Next.js standalone server to bind to all interfaces (fixes Traefik 404)
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Force Server-Side Rendering (SSR) to talk to the backend internally over the Docker network
      - API_BASE_URL_INTERNAL=http://main-service:8000
    build:
      context: .
      target: prod
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        # Fixed arg name to match Dockerfile
        NEXT_PUBLIC_PROTOCOL: ${NEXT_PUBLIC_HTTP_PROTOCOL:-https}
    volumes:
      - ./public:/app/public
      - ../backend/services/main-service/storage/order_files:/app/public/order_files
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # 1. Hardcoded rule bypasses the .env parsing error
      - "traefik.http.routers.frontend.rule=Host(`unidoka.com`) || Host(`i.unidoka.com`) || Host(`app.unidoka.com`) || Host(`admin.unidoka.com`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.frontend.tls=${TLS_ENABLED}"
      - "traefik.http.routers.frontend.tls.certresolver=${CERT_RESOLVER}"
      # 2. Explicitly tell Traefik what domains to get certs for. This stops Traefik
      # from trying to parse the rule string to extract domains, fixing the ACME error.
      - "traefik.http.routers.frontend.tls.domains[0].main=unidoka.com"
      - "traefik.http.routers.frontend.tls.domains[0].sans=*.unidoka.com"
    networks:
      - main-network
    restart: unless-stopped
    stop_grace_period: 20s
    # 3. Upgraded healthcheck to output the actual error to logs if it fails
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(async r => { if(!r.ok) { console.error(await r.text()); process.exit(1) } process.exit(0) }).catch(e => { console.error(e); process.exit(1) })"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  main-network:
    name: main-network
    external: false
  default:
