<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon — DARK theme.
  Served when the user's OS/browser is in dark mode.
  Replace the placeholder <rect> and <circle> with your dark-theme
  artwork. Typically the inverse of the light variant — white bg,
  black mark — so it stays readable on a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Unidoka">
  <title>Unidoka</title>
  <!-- PLACEHOLDER — swap for your real mark -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <circle cx="32" cy="32" r="8" fill="#0b0d10"/>
</svg>
